plugins {
    alias(libs.plugins.quarkus)
    id 'distribution'
}

dependencies {
    implementation libs.bundles.quarkus
    implementation libs.bundles.jackson
    implementation libs.bundles.retrofit

    implementation libs.jdbf
    implementation libs.guava
}

quarkus {
    setFinalName("verkeersdrukte")
}

distributions {
    main {
        contents {
            from("src/dist")
            from(layout.buildDirectory.dir("quarkus-app"))
        }
    }
}

tasks.named("distTar") {
    archiveFileName = "verkeersdrukte.tar"
}

["distTar", "distZip"].each { taskName ->
    tasks.named(taskName) {
        dependsOn(tasks.named("quarkusBuild"))
        useFileSystemPermissions()
    }
}


[versions]
quarkus = "3.40.1.1"
errorprone = "2.51.0"
jackson = "2.22.4"
jdbf = "2.2.4"
junit = "6.1.3"
retrofit = "3.0.0"
versions_plugin= "0.66.0"

[libraries]
errorprone_annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone_core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

jackson-bind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }

quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
jdbf = { module = "com.github.spyhunter99:jdbf", version.ref = "jdbf" }
guava = { module = "com.google.guava:guava", version = "33.4.8-jre" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
jackson = ["jackson-bind", "jackson-yaml", "jackson-xml", "jackson-jsr310", "jackson-jdk8"]
retrofit = ["retrofit", "retrofit-jackson", "retrofit-scalars"]
quarkus = ["quarkus-rest-jackson", "quarkus-config-yaml", "quarkus-smallrye-health"]

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
versions = { id = "io.github.ben-manes.versions", version.ref = "versions_plugin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }

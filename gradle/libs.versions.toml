[versions]
quarkus = "3.40.1.2"
errorprone = "2.53.0"
jdbf = "2.2.4"
retrofit = "3.0.0"
versions_plugin= "0.67.0"

[libraries]
errorprone_annotations = { module = "com.google.errorprone:error_prone_annotations" }
errorprone_core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

jackson-bind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
jackson-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }

quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
jdbf = { module = "com.github.spyhunter99:jdbf", version.ref = "jdbf" }
guava = { module = "com.google.guava:guava", version = "33.4.8-jre" }

junit-bom = { module = "org.junit:junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
jackson = ["jackson-bind", "jackson-yaml", "jackson-xml", "jackson-jsr310", "jackson-jdk8"]
retrofit = ["retrofit", "retrofit-jackson", "retrofit-scalars"]
quarkus = ["quarkus-rest-jackson", "quarkus-config-yaml", "quarkus-smallrye-health"]

[plugins]
errorprone = "net.ltgt.errorprone:5.2.0"
versions = { id = "io.github.ben-manes.versions", version.ref = "versions_plugin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
